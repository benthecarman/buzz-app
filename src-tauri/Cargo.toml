[package]
name = "buzz-foundation"
version = "0.0.0"
description = "Buzz application foundation"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "buzz_foundation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
url = "2"
tauri-build = { version = "2", features = [] }

[dependencies]
buzz-pairing = { path = "../crates/pairing" }
nostr-pairing = { package = "nostr", version = "0.44", features = ["nip44"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

tauri = { version = "2", features = ["unstable"] }
wry = { version = "=0.55.1", default-features = false, features = ["os-webview"] }
buzzodz-plugins = { path = "../crates/plugin-manager" }
buzz-credential-store = { path = "../crates/credential-store" }
buzz-agent-controller = { path = "../crates/agent-controller" }
buzz-desktop = { path = "../crates/desktop" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
buzz-agent = { git = "https://github.com/block/buzz.git", rev = "4f51b9e1010e086a16c099cd8d8218ca974a5e18" }
tokio = { version = "1", features = ["sync", "time", "macros", "process", "io-util", "net"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
bytes = "1"
url = "2"
percent-encoding = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
bech32 = "0.11"
secp256k1 = { version = "0.31", default-features = false, features = ["std"] }
getrandom = "0.3"
zeroize = "1.9"
nostr = { version = "=0.45.5", default-features = false, features = ["std", "nip44", "os-rng"] }
dirs = "6"
rfd = { version = "0.16", default-features = false }
tempfile = "3"
fs2 = "0.4"
arboard = { version = "3", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
rusqlite = { version = "0.38", features = ["bundled"] }

[dev-dependencies]
hex = "0.4"
tokio = { version = "1", features = ["test-util"] }
secp256k1 = { version = "0.31", features = ["std"] }
tauri = { version = "2", features = ["test"] }

[target.'cfg(unix)'.dependencies]
portable-pty = "0.9"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSScreen", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSThread", "NSBundle", "NSString", "NSError", "NSUserDefaults"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["UNUserNotificationCenter", "UNNotificationSettings", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "block2"] }

objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "objc2-app-kit", "block2", "WKWebView", "WKUIDelegate", "WKFrameInfo", "WKSecurityOrigin"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "=0.38.2"
windows-core = "=0.61.2"
tauri-winrt-notification = "=0.8.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
futures-lite = "=2.6.1"
gtk = "0.18"
webkit2gtk = "=2.0.2"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
user-idle = { version = "0.6", default-features = false }
